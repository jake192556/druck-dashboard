name: backtest

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "collector/backtest.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
        timeout-minutes: 5
      - name: Run backtest
        id: run
        timeout-minutes: 20
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p backtest
          set -o pipefail
          python -u collector/backtest.py 2>&1 | tee backtest/run.log
      - name: Commit results (also on failure, for the log)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          git diff --cached --quiet || git commit -m "backtest: $(date -u +%F) (${{ steps.run.outcome }})"
          git pull --rebase --autostash && git push
