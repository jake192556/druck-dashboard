name: update-data

on:
  schedule:
    # 미국장 마감 후 화~토. GitHub 예약 실행은 몇 시간씩 밀리거나 빠지기도 해서 예비 실행을 둔다.
    # 이미 최신이면 커밋·알림 없이 끝난다.
    - cron: "37 21 * * 1-5"   # 06:37 KST
    - cron: "47 23 * * 1-5"   # 08:47 KST (예비)
    - cron: "23 2 * * 2-6"    # 11:23 KST (예비)
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 가능
  push:                   # 수집 코드나 워크플로를 고치면 자동 실행
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt
        timeout-minutes: 5

      - name: Collect & score
        timeout-minutes: 15
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DAILY: ${{ vars.TELEGRAM_DAILY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python -u collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase --autostash && git push
